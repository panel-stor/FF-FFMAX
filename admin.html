<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheatX - Admin Control Panel</title>
    <style>
        :root {
            --bg-color: #050505;
            --red-glow: #ff1a1a;
            --green-glow: #00ff66;
            --yellow-glow: #ffcc00;
            --blue-glow: #0088ff;
            --card-dark: rgba(15, 18, 25, 0.9);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg-color); color: #fff; padding: 15px; max-width: 600px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .header h1 { color: var(--red-glow); text-shadow: 0 0 10px var(--red-glow); font-size: 22px; }

        .dash-card {
            background: var(--card-dark);
            border: 1px solid var(--red-glow);
            box-shadow: 0 0 15px rgba(255, 26, 26, 0.2);
            border-radius: 12px; padding: 15px; margin-bottom: 15px;
        }

        .balance-box {
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--green-glow);
            border-radius: 10px; padding: 15px; text-align: center; margin-bottom: 15px;
        }

        .balance-box h2 { color: var(--green-glow); font-size: 28px; text-shadow: 0 0 10px var(--green-glow); }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        th, td { border: 1px solid rgba(255,255,255,0.1); padding: 8px; text-align: left; word-break: break-all; }
        th { background: #151c28; color: var(--yellow-glow); }

        .btn-action { padding: 4px 8px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; font-size: 11px; }
        .btn-approve { background: var(--green-glow); color: #000; }
        .btn-reject { background: var(--red-glow); color: #fff; }

        .form-input { width: 100%; padding: 10px; background: #151c28; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: #fff; margin-bottom: 10px; }
        .btn-withdraw { width: 100%; padding: 12px; background: linear-gradient(135deg, #0088ff, #004499); color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px var(--blue-glow); }
    </style>

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

    <div class="header">
        <h1>⚙️ ADMIN CONTROL DASHBOARD</h1>
        <p style="color:#aaa; font-size:12px;">Manage Users, Earnings & Approvals</p>
    </div>

    <!-- ADMIN EARNINGS & WITHDRAWAL -->
    <div class="dash-card">
        <div class="balance-box">
            <span style="font-size:12px; color:#aaa;">TOTAL STORE EARNINGS (ADMIN WALLET)</span>
            <h2>₹<span id="adminWalletBal">0</span></h2>
        </div>

        <h3 style="color:#fff; font-size:14px; margin-bottom:10px;">🏦 Bank / UPI Payout Request</h3>
        <input type="text" id="bankUpi" class="form-input" placeholder="Enter Bank Account / UPI ID (e.g. 9354505161@ybl)">
        <input type="number" id="withdrawAmt" class="form-input" placeholder="Amount to Transfer (INR)">
        <button class="btn-withdraw" onclick="requestWithdrawal()">Submit Bank Payout</button>
    </div>

    <!-- PENDING DEPOSIT APPROVALS -->
    <div class="dash-card">
        <h3 style="color:var(--yellow-glow); font-size:15px; margin-bottom:8px;">⏳ Pending Deposit Requests</h3>
        <table>
            <thead>
                <tr>
                    <th>User Email</th>
                    <th>Amt</th>
                    <th>UTR</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="depositReqTable">
                <tr><td colspan="4" style="text-align:center;">Loading requests...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- ALL SIGNED-UP USERS LIST -->
    <div class="dash-card">
        <h3 style="color:var(--blue-glow); font-size:15px; margin-bottom:8px;">👥 Registered Users (<span id="userCount">0</span>)</h3>
        <table>
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Wallet Bal</th>
                </tr>
            </thead>
            <tbody id="userListTable">
                <tr><td colspan="3" style="text-align:center;">Loading users...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // FIREBASE INITIALIZATION
        const firebaseConfig = {
          apiKey: "AIzaSyAPUoAlktXoQ2wPEfWm29rZTEjefbQRMLA",
          authDomain: "cheatx-store-cdc7f.firebaseapp.com",
          databaseURL: "https://cheatx-store-cdc7f-default-rtdb.firebaseio.com",
          projectId: "cheatx-store-cdc7f",
          storageBucket: "cheatx-store-cdc7f.firebasestorage.app",
          messagingSenderId: "576112793849",
          appId: "1:576112793849:web:8e860f001938a2eb5eea28"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. FETCH ADMIN WALLET BALANCE
        db.ref('admin/wallet').on('value', snap => {
            document.getElementById('adminWalletBal').innerText = snap.val() || 0;
        });

        // 2. FETCH ALL REGISTERED USERS & THEIR WALLET BALANCES
        db.ref('users').on('value', snap => {
            const users = snap.val();
            const table = document.getElementById('userListTable');
            table.innerHTML = "";
            let count = 0;

            if(users) {
                for(let uid in users) {
                    count++;
                    const u = users[uid];
                    table.innerHTML += `
                        <tr>
                            <td>${u.username || 'User'}</td>
                            <td>${u.email}</td>
                            <td style="color:var(--green-glow); font-weight:bold;">₹${u.wallet || 0}</td>
                        </tr>
                    `;
                }
            } else {
                table.innerHTML = `<tr><td colspan="3" style="text-align:center;">No users registered yet.</td></tr>`;
            }
            document.getElementById('userCount').innerText = count;
        });

        // 3. FETCH PENDING ADD MONEY REQUESTS
        db.ref('requests').on('value', snap => {
            const reqs = snap.val();
            const table = document.getElementById('depositReqTable');
            table.innerHTML = "";

            let foundPending = false;
            if(reqs) {
                for(let reqId in reqs) {
                    const r = reqs[reqId];
                    if(r.status === "pending") {
                        foundPending = true;
                        table.innerHTML += `
                            <tr>
                                <td>${r.email}</td>
                                <td style="color:var(--green-glow); font-weight:bold;">₹${r.amount}</td>
                                <td>${r.utr}</td>
                                <td>
                                    <button class="btn-action btn-approve" onclick="approveDeposit('${reqId}', '${r.uid}', ${r.amount})">✓</button>
                                    <button class="btn-action btn-reject" onclick="rejectDeposit('${reqId}')">✕</button>
                                </td>
                            </tr>
                        `;
                    }
                }
            }
            if(!foundPending) {
                table.innerHTML = `<tr><td colspan="4" style="text-align:center;">No pending requests.</td></tr>`;
            }
        });

        // APPROVE MONEY DEPOSIT (CREDIT TO USER WALLET)
        function approveDeposit(reqId, uid, amt) {
            db.ref('users/' + uid + '/wallet').transaction(curr => (curr || 0) + amt).then(() => {
                db.ref('requests/' + reqId + '/status').set('approved');
                alert("Deposit Approved! Money added to user's wallet.");
            });
        }

        // REJECT MONEY DEPOSIT
        function rejectDeposit(reqId) {
            db.ref('requests/' + reqId + '/status').set('rejected');
            alert("Deposit Request Rejected!");
        }

        // REQUEST BANK WITHDRAWAL
        function requestWithdrawal() {
            const upi = document.getElementById('bankUpi').value;
            const amt = parseInt(document.getElementById('withdrawAmt').value);
            const currentBal = parseInt(document.getElementById('adminWalletBal').innerText);

            if(!upi || !amt) return alert("Please fill Bank Details & Amount!");
            if(amt > currentBal) return alert("Insufficient Admin Wallet Balance!");

            db.ref('admin/payouts').push({
                account: upi,
                amount: amt,
                status: "Pending Withdrawal",
                date: new Date().toLocaleString()
            }).then(() => {
                // Deduct from Admin Wallet
                db.ref('admin/wallet').set(currentBal - amt);
                alert("Withdrawal request submitted! Amount deducted from Admin Wallet.");
                document.getElementById('withdrawAmt').value = "";
            });
        }
    </script>
</body>
  </html>
